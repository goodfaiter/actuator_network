[project]
name = "actuator_network"
version = "0.1.0"
description = "Package for processing mcap files and training an actuator network"
authors = [
    {name = "Valentin Yuryev", email = "valentin.yuryev@gmail.com"},
]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "torch>=2.0",
    "numpy",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "tqdm",
    "PyQt6",
    "pyarrow",
    "rosbags",
    "mcap",
    "mcap-ros2-support",
    "wandb",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6.0",
]

[project.scripts]
train-mlp = "actuator_network.train_mlp:main"
train-rnn = "actuator_network.train_rnn:main"
train-transformer = "actuator_network.train_transformer:main"
predict = "actuator_network.test:main"

[project.urls]
repository = "https://github.com/goodfaiter/actuator_network"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
default-groups = ["dev"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
]

[tool.ruff.lint.pydocstyle]
convention = "google"
